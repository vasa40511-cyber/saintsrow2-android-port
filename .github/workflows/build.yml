name: Validate Android build and game archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
      - name: Verify uploaded game archive
        run: |
          test -f game/saintsrow2_n95.jar
          unzip -l game/saintsrow2_n95.jar | head -80
          unzip -p game/saintsrow2_n95.jar META-INF/MANIFEST.MF | tee /tmp/game-manifest.txt
      - name: Checkout J2ME Loader HD
        uses: actions/checkout@v4
        with:
          repository: fuyijian/J2ME-Loader-HD
          ref: master
          path: j2me-loader-hd
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Build base HD emulator APK
        working-directory: j2me-loader-hd
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleOpenDebug
      - name: Upload verification outputs
        uses: actions/upload-artifact@v4
        with:
          name: j2me-loader-hd-validation
          path: |
            j2me-loader-hd/app/build/outputs/apk/open/debug/*.apk
            /tmp/game-manifest.txt
          if-no-files-found: error
          retention-days: 14
