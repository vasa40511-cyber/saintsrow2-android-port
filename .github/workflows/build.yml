name: Validate Android build and game archive

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game/**'
      - 'patches/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

concurrency:
  group: saintsrow2-android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout port repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify uploaded game archive
        run: |
          test -f game/saintsrow2_n95.jar
          unzip -l game/saintsrow2_n95.jar | head -80
          unzip -p game/saintsrow2_n95.jar META-INF/MANIFEST.MF | tee /tmp/game-manifest.txt
      - name: Checkout J2ME Loader HD
        uses: actions/checkout@v4
        with:
          repository: fuyijian/J2ME-Loader-HD
          ref: master
          path: j2me-loader-hd
          fetch-depth: 1
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Bootstrap Android SDK command line tools
        uses: android-actions/setup-android@v3
        continue-on-error: true
      - name: Add Android SDK manager to PATH
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/16.0/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865"
      - name: Prepare standalone Saints Row MIDlet build
        working-directory: j2me-loader-hd
        run: |
          sed -i "s/COMPILE_SDK = 37/COMPILE_SDK = 36/" build.gradle
          sed -i "s/ch.acra:acra-dialog:5.14.2/ch.acra:acra-dialog:5.13.1/" app/build.gradle
          mkdir -p app/libs
          cp ../game/saintsrow2_n95.jar app/libs/saintsrow2_n95.jar
          mkdir -p app/src/midlet/resources/MIDLET-META-INF
          unzip -p ../game/saintsrow2_n95.jar META-INF/MANIFEST.MF > app/src/midlet/resources/MIDLET-META-INF/MANIFEST.MF
          sed -i '/^dependencies {/a\    midletImplementation files("libs/saintsrow2_n95.jar")' app/build.gradle
          cat >> app/build.gradle <<'GRADLE'

          // Bundle MIDlet resources at APK root so AppClassLoader.getResourceAsStream() can resolve them.
          android.sourceSets.midlet.resources.srcDirs += ['src/midlet/resources']
          GRADLE
          python3 - <<'PY'
          p = 'app/src/main/java/javax/microedition/shell/MicroActivity.java'
          s = open(p, encoding='utf-8').read()
          needle = 'microLoader = new MicroLoader(this, appPath);'
          inject = '''// Keep a persistent profile but enforce the dedicated landscape game controls.
                  File profileDir = new File(getApplicationInfo().dataDir + "/files/configs/midlet");
                  if (!profileDir.exists() && !profileDir.mkdirs()) {
                      throw new IllegalStateException("Cannot create embedded MIDlet profile: " + profileDir);
                  }
                  ru.playsoftware.j2meloader.config.ProfileModel profile =
                          ru.playsoftware.j2meloader.config.ProfilesManager.loadConfig(profileDir);
                  if (profile == null) {
                      profile = new ru.playsoftware.j2meloader.config.ProfileModel(profileDir);
                  }
                  profile.dir = profileDir;
                  profile.forceFullscreen = true;
                  profile.supersampling = 2;
                  profile.orientation = 3;
                  profile.showKeyboard = true;
                  profile.vkType = 7;
                  profile.vkAlpha = 112;
                  profile.vkHideDelay = 0;
                  profile.vkForceOpacity = false;
                  profile.touchInput = false;
                  ru.playsoftware.j2meloader.config.ProfilesManager.saveConfig(profile);
                  // Discard an old saved keypad layout so the new analog-stick layout is used.
                  new File(profileDir, "VirtualKeyboardLayout").delete();
                  microLoader = new MicroLoader(this, appPath);'''
          if needle not in s:
              raise SystemExit("Could not locate MicroActivity MIDlet bootstrap point")
          open(p, 'w', encoding='utf-8').write(s.replace(needle, inject, 1))
          PY
          python3 ../patches/apply_saintsrow2_customizations.py
          chmod +x gradlew
          ./gradlew --build-cache --parallel assembleMidletDebug
          APK=$(find app/build/outputs/apk/midlet/debug -name '*.apk' -print -quit)
          test -n "$APK"
          echo "APK=$APK"
          unzip -l "$APK" | grep -E 'MIDLET-META-INF/MANIFEST.MF|Title.png|Mainmenu.png|SaintsRow2' | head -30
          : > /tmp/all-dex-strings.txt
          while IFS= read -r dex; do
            unzip -p "$APK" "$dex" | strings >> /tmp/all-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?[.]dex$')
          grep -F 'LSaintsRow2;' /tmp/all-dex-strings.txt
          unzip -Z1 "$APK" > /tmp/apk-files.txt
          grep -F 'MIDLET-META-INF/MANIFEST.MF' /tmp/apk-files.txt
      - name: Smoke-test game launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            APK=$(find j2me-loader-hd/app/build/outputs/apk/midlet/debug -name '*.apk' -print -quit)
            PACKAGE=com.example.androidlet.saints_row_2.debug
            adb install "$APK"
            adb logcat -c
            adb shell am start -n "$PACKAGE/javax.microedition.shell.MicroActivity"
            sleep 30
            adb logcat -d -s AndroidRuntime:E MicroActivity:D MicroLoader:D AppClassLoader:E MidletThread:E SaintsRowAudio:E MediaPlayer:E AudioTrack:E > /tmp/saintsrow2-logcat.txt
            cat /tmp/saintsrow2-logcat.txt
            if grep -q 'FATAL EXCEPTION' /tmp/saintsrow2-logcat.txt; then exit 1; fi
            adb shell pidof "$PACKAGE"
            adb exec-out screencap -p > /tmp/saintsrow2-screen.png
            test -s /tmp/saintsrow2-screen.png
            test "$(stat -c%s /tmp/saintsrow2-screen.png)" -gt 10000
      - name: Upload standalone game APK
        uses: actions/upload-artifact@v4
        with:
          name: saints-row-2-android-apk-candidate
          path: |
            j2me-loader-hd/app/build/outputs/apk/midlet/debug/*.apk
            /tmp/game-manifest.txt
            /tmp/saintsrow2-logcat.txt
            /tmp/saintsrow2-screen.png
          if-no-files-found: error
          retention-days: 14
